# ── App-wide settings ─────────────────────────────────────────────────────────

# IANA timezone used for the Timestamp column (Streamlit Cloud servers run in UTC).
timezone: Europe/London

default_plot_x: "Laser Processing Parameters: Scan Speed (mm/s)"
default_plot_y: "Laser Processing Parameters: Laser Power (W)"
default_plot_colour: "Sample: Substrate material"
default_filters:
  "General: Experiment type": ["Weld", "AM"]

# Derived quantities offered in the Plot tab. `inputs` maps a short alias to a
# sheet column ("Group: Variable"); `formula` is arithmetic over those aliases.
# Optional `exclude_zero` lists aliases whose zero values make the quantity
# meaningless; those runs are left out.
derived:
  - name: Linear Energy Density (J/mm)
    formula: power / speed
    inputs:
      power: "Laser Processing Parameters: Laser Power (W)"
      speed: "Laser Processing Parameters: Scan Speed (mm/s)"
  - name: Specific Energy Density (J/mm²)
    formula: power / (speed * spot)
    inputs:
      power: "Laser Processing Parameters: Laser Power (W)"
      speed: "Laser Processing Parameters: Scan Speed (mm/s)"
      spot: "Laser Processing Parameters: Laser Spot Size (mm)"
  - name: Powder Delivery Ratio (rpm·s/mm)
    formula: feed / speed
    inputs:
      feed: "Powder delivery: Feed rate (rpm)"
      speed: "Laser Processing Parameters: Scan Speed (mm/s)"
    exclude_zero: [feed, speed]
    note: >-
      Uncalibrated. Proportional to g/mm; needs the feeder calibration factor
      and powder density (see powder_calibration) for absolute units.

# Defaults for the Powder Delivery Rate calculator.
powder_calibration:
  feeder_factor_mm3_per_s_per_rpm: 1.3306   # GTV PF 2/2 LC, from calibration spreadsheet
  default_powder_density_kg_m3: 2700

# ── Variable groups ───────────────────────────────────────────────────────────

groups:

  - name: General
    always_on: true
    filterable: true
    variables:
      - name: Run ID
        type: auto_increment
        format: prefixed
        prefix: "RUN"
        pad: 4
        start: 1
        required: true
      - name: Operator
        type: select
        options: [HEC, SB, YW, XH]
        help: "Current Operator / Shift Leader initials."
        required: true
      - name: Experiment type
        type: select
        options: [Setup, Weld, AM, Flat]
        default: Setup
        help: "Type of Experiment"
      - name: Experiment group
        type: text
        default: ""
        help: "Name of the group of experiments this scan belongs to"
        required: true
      - name: Layer number
        type: integer
        default: 0
      - name: Build location
        type: integer
        default: 0
      - name: Notes
        type: text
        default: ""
        help: "Free text entry. Add notes on the run here"
      - name: Flat ID
        type: integer
        default: 0
        help: "ID for the flat associated for this file. Use 0 if no flat is relevant"

  - name: Sample
    always_on: true
    filterable: true
    variables:
      - name: Substrate ID
        type: text
        default: ""
      - name: Substrate material
        type: text
        default: ""
      - name: Powder material
        type: text
        default: ""
      - name: Powder size distribution (um)
        type: text
        default: ""
      - name: Sample manipulation
        type: text
        default: "Meca500 6-axis Robotic arm"

  - name: Laser Processing Parameters
    always_on: true
    filterable: true
    variables:
      - name: Laser Power (W)
        type: float
        default: 0
      - name: Scan Speed (mm/s)
        type: float
        default: 0
      - name: Laser Spot Size (mm)
        type: float
        default: 0
      - name: Laser
        type: text
        default: "TruFiber 500 P compact (FD44-A)"
      - name: Optics
        type: text
        default: "Optogama beam reducer"

  - name: Powder delivery
    always_on: true
    filterable: true
    variables:
      - name: Feed rate (rpm)
        type: float
        default: 0
      - name: Shield Gas (lpm)
        type: float
        default: 0
      - name: Carrier gas (lpm)
        type: float
        default: 0
      - name: Powder feeder
        type: text
        default: "GTV PF 2/2 LC"
      - name: Hopper type
        type: select
        options: [Full Hopper, Mini Hopper]
        default: Full Hopper
      - name: Nozzle
        type: select
        options: [HighNo 4.0 - 7mm standoff, HighNo 4.0 - 17 degree, Other (add in notes)]
        default: HighNo 4.0 - 7mm standoff

  - name: X-ray beam settings
    always_on: false
    variables:
      - name: Beamline
        type: select
        options: [DLS I12, ESRF ID19, HEPS ID23, APS ID32, Other]
        default: DLS I12
        help: "Current beamline or Laboratory Environment"
      - name: Beam Energy (KeV)
        type: float
        default: 0
      - name: Beam type
        type: select
        options: [White, Pink, Monochromatic]
      - name: Insertion Device
        type: select
        options: [u32, other]
      - name: Undulator gap
        type: float
        default: 0
      - name: Camera
        type: select
        options: [Photron, Shimadzu]
      - name: Exposure time (us)
        type: float
        default: 0
      - name: Framerate (kfps)
        type: float
        default: 0
      - name: Pixel Size (um)
        type: float
        default: 0
      - name: Propagation distance (m)
        type: float
        default: 0
      - name: X-ray scan number
        type: auto_increment
        format: padded
        pad: 4
        start: 1

  - name: IR Camera Settings
    always_on: false
    variables:
      - name: Filter
        type: select
        options: [Empty, ND2, ND3, Other]
        default: ND2
      - name: Temperature range (C)
        type: text
        default: ""
      - name: Framerate (kfps)
        type: float
        default: 0
      - name: IR scan number
        type: auto_increment
        format: padded
        pad: 4
        start: 1

  - name: Ultrasonic Processing Parameters
    always_on: false
    filterable: true
    variables:
      - name: Amplitude (%)
        type: float
        default: 0
      - name: Frequency (kHz)
        type: float
        default: 35.14
      - name: Booster
        type: select
        options: [One, Two, None]
